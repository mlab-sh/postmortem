// Metadata for `apt-ftparchive release`, which generates dists/stable/Release
// from the Packages indexes. Kept in the repo so the index stays reproducible:
// the release job regenerates the whole dists/ tree from the committed stanzas
// in apt/stanzas/ on every run.
//
// Valid-Until is deliberately NOT set. It would bound a rollback attack (an
// attacker with write access to the bucket replaying an old but still validly
// signed InRelease, to freeze users on a vulnerable version), but it also makes
// the repository expire on its own. Only add it together with a scheduled
// workflow that re-signs the index before it lapses.
APT::FTPArchive::Release {
  Origin "postmortem";
  Label "postmortem";
  Suite "stable";
  Codename "stable";
  Architectures "amd64 arm64";
  Components "main";
  Description "postmortem - supply-chain scanner";
};
