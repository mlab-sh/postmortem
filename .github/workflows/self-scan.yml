name: Supply-chain self-scan

# Dogfood: run the published postmortem Action against postmortem's own
# dependency graph. Both signals apply here: `--vulns` scans Cargo.lock for
# known advisories, and `--online` resolves each crate through crates.io to its
# source repo for reputation and provenance scoring.

on:
  push:
    branches: [main]
    paths: ["Cargo.lock", "Cargo.toml"]
  pull_request:
    paths: ["Cargo.lock", "Cargo.toml"]
  schedule:
    - cron: "0 6 * * 1" # weekly — catch newly-published advisories on pinned deps
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # for the SARIF upload to Code Scanning

jobs:
  scan:
    name: postmortem gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: postmortem supply-chain gate
        uses: mlab-sh/postmortem@v2
        with:
          path: .
          online: true # resolve crates.io -> source repo for reputation scoring
          vulns: true
          fail-on-vuln: high # block only on High+ advisories
          sarif: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vuln-token: ${{ secrets.VULN_MLAB_TOKEN }} # optional — raises the rate limit
