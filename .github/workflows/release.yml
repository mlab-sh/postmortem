name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --all --locked

  version:
    name: Resolve version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: v
        run: |
          VERSION=$(awk -F '"' '/^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      # `shell: bash` so this one step covers every runner: the Windows images
      # ship Git Bash, which keeps mktemp/tar/cp working there too. Both the
      # binary name and the archive format are derived from the target triple,
      # so adding a target never means editing this step again.
      - name: Package archive
        id: pkg
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          NAME="postmortem-${VERSION}-${TARGET}"
          STAGE="$(mktemp -d)/${NAME}"
          mkdir -p "$STAGE"

          case "$TARGET" in
            *windows*) BIN=postmortem.exe ;;
            *)         BIN=postmortem ;;
          esac
          cp "target/${TARGET}/release/${BIN}" "$STAGE/"
          cp LICENSE "$STAGE/"
          cp README.md "$STAGE/"

          case "$TARGET" in
            *windows*)
              # zip rather than tar.gz: Explorer opens it natively, which is
              # what a Windows user expects from a release asset. `7z` ships on
              # the GitHub Windows images.
              FILE="${NAME}.zip"
              (cd "$(dirname "$STAGE")" && 7z a -tzip -bso0 "$FILE" "$NAME")
              mv "$(dirname "$STAGE")/${FILE}" .
              ;;
            *)
              FILE="${NAME}.tar.gz"
              tar -czf "$FILE" -C "$(dirname "$STAGE")" "$NAME"
              ;;
          esac
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.file }}

  release:
    name: Publish release + brew formula
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          ls -la dist

      - name: Compute sha256 hashes
        id: hashes
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          for target in x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            # Windows ships a zip, every other target a tarball — same rule as
            # the packaging step, so adding a target stays a one-word change.
            case "$target" in
              *windows*) FILE="dist/postmortem-${VERSION}-${target}.zip" ;;
              *)         FILE="dist/postmortem-${VERSION}-${target}.tar.gz" ;;
            esac
            HASH=$(sha256sum "$FILE" | cut -d' ' -f1)
            key=$(echo "$target" | tr '[:lower:]-' '[:upper:]_')
            echo "${key}=${HASH}" >> "$GITHUB_OUTPUT"
            echo "  ${target}: ${HASH}"
          done

      - name: Generate Formula/postmortem.rb
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p Formula
          cat > Formula/postmortem.rb <<EOF
          class Postmortem < Formula
            desc "Supply-chain scanner. Flags malicious install code, typosquats, and shady provenance across your dependencies and your OS packages. Repo-reputation scoring, known-CVE intel, no telemetry."
            homepage "https://github.com/mlab-sh/postmortem"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/mlab-sh/postmortem/releases/download/v#{version}/postmortem-#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${{ steps.hashes.outputs.AARCH64_APPLE_DARWIN }}"
              else
                url "https://github.com/mlab-sh/postmortem/releases/download/v#{version}/postmortem-#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${{ steps.hashes.outputs.X86_64_APPLE_DARWIN }}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/mlab-sh/postmortem/releases/download/v#{version}/postmortem-#{version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${{ steps.hashes.outputs.X86_64_UNKNOWN_LINUX_GNU }}"
              elsif Hardware::CPU.arm?
                url "https://github.com/mlab-sh/postmortem/releases/download/v#{version}/postmortem-#{version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${{ steps.hashes.outputs.AARCH64_UNKNOWN_LINUX_GNU }}"
              end
            end

            def install
              bin.install "postmortem"
            end

            test do
              assert_match "postmortem", shell_output("#{bin}/postmortem --version")
            end
          end
          EOF
          sed -i 's/^          //' Formula/postmortem.rb
          cat Formula/postmortem.rb

      # Scoop's equivalent of the tap: a bucket is just a git repo, and Scoop
      # looks in `bucket/` when that directory exists. Keeping the manifest here
      # rather than in a separate repo means one release job bumps both package
      # managers, and `scoop bucket add` points straight at this repo.
      - name: Generate bucket/postmortem.json
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          NAME="postmortem-${VERSION}-x86_64-pc-windows-msvc"
          mkdir -p bucket
          cat > bucket/postmortem.json <<EOF
          {
              "version": "${VERSION}",
              "description": "Supply-chain scanner. Flags malicious install code, typosquats, and shady provenance across your dependencies and your OS packages. Repo-reputation scoring, known-CVE intel, no telemetry.",
              "homepage": "https://github.com/mlab-sh/postmortem",
              "license": "Apache-2.0",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/mlab-sh/postmortem/releases/download/v${VERSION}/${NAME}.zip",
                      "hash": "${{ steps.hashes.outputs.X86_64_PC_WINDOWS_MSVC }}",
                      "extract_dir": "${NAME}"
                  }
              },
              "bin": "postmortem.exe",
              "checkver": {
                  "github": "https://github.com/mlab-sh/postmortem"
              },
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/mlab-sh/postmortem/releases/download/v\$version/postmortem-\$version-x86_64-pc-windows-msvc.zip",
                          "extract_dir": "postmortem-\$version-x86_64-pc-windows-msvc"
                      }
                  }
              }
          }
          EOF
          sed -i 's/^          //' bucket/postmortem.json
          cat bucket/postmortem.json

      - name: Commit updated formula and bucket manifest
        run: |
          if git diff --quiet Formula/postmortem.rb bucket/postmortem.json; then
            echo "Formula and manifest unchanged, skipping commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Formula/postmortem.rb bucket/postmortem.json
            git commit -m "chore: bump Homebrew formula and Scoop manifest to v${{ needs.version.outputs.version }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
