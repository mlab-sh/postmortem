[package]
name = "postmortem"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
walkdir = "2"
ignore = "0.4"
regex = "1"
owo-colors = "4"
comfy-table = { version = "7", features = ["custom_styling"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
