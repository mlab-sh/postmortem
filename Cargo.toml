[package]
name = "postmortem"
version = "2.1.2"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
walkdir = "2"
ignore = "0.4"
regex = "1"
owo-colors = "4"
comfy-table = { version = "7", features = ["custom_styling"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
indicatif = "0.18"
ureq = "2"
serde_yaml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
serde_yaml = "0.9"
