id: CB-DEP-AGE-003
title: Grant release-age exceptions explicitly and for a limited time
finding:
  title: The release-age rule is bypassed without trace or without end date
status: draft
profiles: [baseline]
risk:
  severity: low
assessment: manual
tags: [release-age, exception]
description: |
  When a version younger than the release-age threshold is needed (typically an urgent security fix), the exception names the package and exact version, the reason, the approver, and expires after at most {{ max_exception_days }} days.
rationale: |
  Without a clear process, teams disable the rule globally the first time they are blocked, and never turn it back on.
impact: |
  Someone must be available to approve exceptions quickly.
parameters:
  - name: max_exception_days
    type: integer
    description: Maximum lifetime of a release-age exception.
    unit: days
    default: 7
    minimum: 1
    maximum: 30
audit:
  manual: |
    1. List active release-age exceptions.
    2. Check each one targets an exact version, has a recorded reason and approver, and is younger than {{ max_exception_days }} days.
    3. Check the global rule is not disabled.
remediation:
  manual: |
    1. Define who can approve exceptions and where they are recorded.
    2. Remove expired and global exceptions.
