id: CB-DEP-LOCK-004
title: Allow only approved sources in lockfiles
finding:
  title: A lockfile change can introduce packages from an unexpected source
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: partial
tags: [lockfile, review, registry]
description: |
  An automated check on every change rejects lockfiles that resolve a package from a host, scheme or source type other than the approved registries.
rationale: |
  Lockfiles are long and rarely read in review. Swapping a resolved URL to an attacker's host is an easy way to hide a malicious package in an otherwise harmless change.
impact: |
  The check must be updated when a registry URL changes.
audit:
  manual: |
    1. Check that a lockfile source check runs on every change request.
    2. Check that it fails on a non-approved host or a non-registry source.
remediation:
  manual: |
    1. Add a check to the pipeline that parses each lockfile and compares every resolved source with the list of approved registries.
