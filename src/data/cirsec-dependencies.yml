  Security-relevant package manager settings (registries, namespace mappings, release age, script execution, frozen installs) are set in configuration files committed with the project, so workstations and pipelines behave the same way.
rationale: |
  Settings that only live in one person's home folder or one pipeline are lost, drift, and are impossible to review. Committed configuration is versioned and reviewed like code.
impact: |
