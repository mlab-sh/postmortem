id: CB-DEP-CI-001
title: Install dependencies in a step without secrets
finding:
  title: Dependencies are installed in an environment that holds secrets
  description: A malicious package can read deploy keys, cloud credentials and publish tokens as soon as it is installed.
status: draft
profiles: [baseline]
risk:
  severity: high
assessment: partial
tags: [ci, secrets]
description: |
  The pipeline step that downloads and installs dependencies has no access to deployment credentials, cloud credentials, signing keys or publish tokens. Those are only given to later steps that need them.
rationale: |
  Install-time code, and test code from dependencies, run with whatever the environment holds. Separating installation from secrets limits what a malicious package can steal.
impact: |
  Pipelines may need to be split into several jobs or steps with different secrets.
audit:
  manual: |
    1. Review the environment of install steps in each pipeline.
    2. Check that no secret other than read-only registry access is available.
remediation:
  manual: |
    1. Move secrets to the steps that need them.
    2. Split installation and deployment into separate jobs if secrets are job-wide.
