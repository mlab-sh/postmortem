id: CB-DEP-VULN-004
title: Track unmaintained, deprecated and end-of-life components
finding:
  title: The product depends on components that no longer receive fixes
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: partial
tags: [end-of-life, maintenance]
description: |
  Dependencies marked as deprecated by their registry, archived by their maintainers, or without any release for a long time are identified, as well as language runtimes past their end of life. Each one has a replacement plan or a recorded acceptance.
rationale: |
  An unmaintained component will not get a fix when the next vulnerability is found, and abandoned package names are a target for takeover.
impact: |
  Replacing a core dependency can be a large piece of work.
audit:
  manual: |
    1. List deprecated, archived and long-inactive dependencies and end-of-life runtimes.
    2. Check each has a plan or an acceptance.
remediation:
  manual: |
    1. Add deprecation and end-of-life checks to the scheduled scan.
    2. Plan replacements, starting with runtime dependencies.
references:
