id: CB-DEP-VULN-002
title: Block packages known to be malicious
finding:
  title: Packages flagged as malicious can still be installed
status: draft
profiles: [baseline]
risk:
  severity: critical
assessment: partial
tags: [malware, registry]
description: |
  The registry proxy or the pipeline refuses packages and versions listed as malicious in public advisories. A match fails the build and raises an alert. No exception is possible.
rationale: |
  A malicious package is not a vulnerability to patch later: installing it is already the incident. Advisory databases publish malicious package reports, often within hours.
impact: |
  None known.
audit:
  manual: |
    1. Check that malicious package advisories are part of the scan or proxy policy.
    2. Check that a match blocks the install or build and alerts the security team.
remediation:
  manual: |
    1. Enable malicious package advisories in the registry proxy policy and the dependency scan.
    2. Treat any match on an existing project as an incident (CB-DEP-IR-001).
