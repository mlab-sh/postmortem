id: CB-DEP-LOCK-005
title: Pin direct dependencies of applications to exact versions
finding:
  title: Application manifests use version ranges
status: draft
profiles: [hardened]
risk:
  severity: low
assessment: partial
tags: [lockfile, pinning]
description: |
  In deployable applications, direct dependencies are declared with an exact version, not a range. Version changes happen only through a reviewed change to the manifest.
rationale: |
  With a lockfile and frozen installs, ranges are already safe in builds. Exact versions also protect the moments when the lockfile is regenerated, and make every upgrade visible in the manifest diff.
impact: |
  More update proposals to review.
notes: |
  Does not apply to libraries meant to be consumed by others, which should declare compatible ranges.
audit:
  manual: |
    1. Check application manifests for direct dependencies declared with a range.
remediation:
  manual: |
    1. Replace ranges with the exact version currently in the lockfile.
