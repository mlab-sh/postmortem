id: CB-DEP-SRC-004
title: Declare dependencies only from a registry
finding:
  title: Dependencies are pulled from direct URLs, source repositories or local paths
  description: Code fetched from a URL or a repository branch bypasses registry controls and can change at any time without a new version.
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: partial
tags: [registry, lockfile]
description: |
  Production dependencies are declared as named, versioned packages from an approved registry. Direct archive URLs, source repository references and local paths are not used, except under a documented and reviewed exception.
rationale: |
  Non-registry sources skip release-age rules, malicious package blocking and vulnerability matching. A branch or unversioned URL can point to different content between two builds.
impact: |
  Forks or unreleased fixes must be published to the private registry instead of referenced directly.
notes: |
  If an exception is needed, reference an immutable identifier (a full commit hash, a checksum) and record the reason.
audit:
  manual: |
    1. Search manifests and lockfiles for dependencies whose source is a URL, a source repository or a path.
    2. Check that each one has a documented exception and an immutable reference.
remediation:
  manual: |
    1. Publish the needed package to the private registry under a proper version.
    2. Replace the direct reference with the registry package.
