id: CB-DEP-CI-003
title: Limit network access of builds to approved registries
finding:
  title: Build environments can reach any host on the internet
status: draft
profiles: [hardened]
risk:
  severity: medium
assessment: partial
tags: [ci, network]
description: |
  Build and install steps can only reach the organization's registries and the services the build requires. Other outbound traffic is blocked and logged.
rationale: |
  Blocks malicious install code from exfiltrating secrets or downloading a second stage, and stops builds from silently fetching unvetted code.
impact: |
  Builds that download from the internet break until their sources are proxied.
audit:
  manual: |
    1. From a build environment, try to reach an arbitrary internet host: it must fail.
    2. Check that blocked attempts are logged.
remediation:
  manual: |
    1. Apply an egress allowlist to build environments, limited to approved registries and required services.
