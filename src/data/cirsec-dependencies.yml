id: CB-DEP-CI-004
title: Separate dependency caches by trust level
finding:
  title: Untrusted builds can write to caches used by trusted builds
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: partial
tags: [ci, cache]
description: |
  Dependency caches are keyed on the lockfile hash. Builds of untrusted changes (external contributions, forks) cannot write to caches read by default-branch or release builds.
rationale: |
  A poisoned cache lets an attacker who can run one build insert packages into every following build, bypassing lockfile and registry controls.
impact: |
  Slightly lower cache hit rates.
audit:
  manual: |
    1. Review cache configuration of pipelines.
    2. Check cache keys include the lockfile hash and that untrusted builds cannot write to trusted caches.
remediation:
  manual: |
    1. Key caches on the lockfile hash.
    2. Give untrusted builds read-only or separate caches.
