id: CB-DEP-LOCK-003
title: Verify package integrity against recorded hashes
finding:
  title: Downloaded packages are not checked against a known hash
status: draft
profiles: [baseline]
risk:
  severity: high
assessment: partial
tags: [lockfile, integrity]
description: |
  The lockfile records a cryptographic hash for every package, and the package manager verifies the downloaded content against it on every install. Where the ecosystem does not do this by default, hash checking is turned on explicitly.
rationale: |
  Hashes guarantee that what is installed today is byte-for-byte what was reviewed when the lockfile was changed, even if a registry, mirror or cache serves something else.
impact: |
  None known, once lockfiles contain hashes. Older lockfiles may need to be regenerated.
audit:
  manual: |
    1. Check that lockfiles contain a hash for every entry.
    2. Check that hash verification is not disabled in configuration or pipeline flags.
remediation:
  manual: |
    1. Regenerate lockfiles with hashes.
    2. Turn on mandatory hash checking where it is optional.
