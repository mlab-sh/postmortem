id: CB-DEP-VET-003
title: Remove unused dependencies
finding:
  title: The project declares dependencies it does not use
status: draft
profiles: [baseline]
risk:
  severity: low
assessment: partial
tags: [minimization]
description: |
  Dependencies that are no longer imported or used are removed from manifests and lockfiles. This is checked regularly.
rationale: |
  Unused dependencies still get installed, still run install scripts, still show up in vulnerability reports, and still can be compromised. Removing them is the cheapest risk reduction.
impact: |
  None known.
audit:
  manual: |
    1. Run an unused-dependency analysis on each project.
    2. Check findings are handled.
remediation:
  manual: |
    1. Remove unused dependencies and regenerate the lockfile.
    2. Run the analysis periodically or in the pipeline.
