id: CB-DEP-EXEC-003
title: Do not run on-demand packages without a pinned version
finding:
  title: Scripts and pipelines download and run the latest version of a package
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: partial
tags: [pinning, ci]
description: |
  Commands that fetch and run a package in one step, without adding it to the project, are not used in pipelines, scripts or documentation unless they pin an exact version that goes through the same release-age and source rules as other dependencies.
rationale: |
  One-shot runners usually resolve the latest version at every run and bypass the lockfile, so a malicious release runs immediately everywhere the command is used.
impact: |
  Tools used this way must be added as pinned development dependencies or pinned in the command.
audit:
  manual: |
    1. Search pipelines, scripts, container files and documentation for one-shot package runner commands.
    2. Check each one pins an exact version.
remediation:
  manual: |
    1. Add the tool as a pinned development dependency, or pin an exact version in the command.
