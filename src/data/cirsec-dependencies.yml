id: CB-DEP-VET-001
title: Review every new direct dependency before merge
finding:
  title: New dependencies can be added without review
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: partial
tags: [review, code-owners]
description: |
  Any change that adds a direct dependency, or changes its source, needs approval from a person or group responsible for dependencies. Manifest files are protected so that this approval is required by the repository, not left to habit.
rationale: |
  Each new dependency brings its full transitive tree, its maintainers and their security practices into the product. It is one of the highest-impact lines of a change, and the easiest to overlook.
impact: |
  Changes that add dependencies take longer to merge.
audit:
  manual: |
    1. Check that manifest files require approval from a designated reviewer group.
    2. Sample recent additions and check they were reviewed against CB-DEP-VET-002.
remediation:
  manual: |
    1. Assign required reviewers for manifest files in the repository settings.
    2. Publish the review criteria (CB-DEP-VET-002).
